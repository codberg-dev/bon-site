<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>404 · BON</title>
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<style>
:root{--bg:#f7f7f5;--surface:#fff;--ink:#141826;--soft:#474d63;--line:#e4e5ea;--accent:#5b3fe0;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0b0e16;--surface:#121725;--ink:#eef0f6;--soft:#b3b9cc;--line:#232a3d;--accent:#a993ff;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans KR","Noto Sans SC","Noto Sans JP",sans-serif;line-height:1.6}
main{max-width:640px;margin:0 auto;padding:64px 16px}
h1{font-size:56px;line-height:1;margin:0 0 32px;letter-spacing:-.03em}
ul{list-style:none;margin:0;padding:0;display:grid;gap:12px}
li{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 20px}
h2{font-size:18px;margin:0 0 4px}
p{margin:0 0 8px;color:var(--soft)}
a{color:var(--accent);font-weight:600;display:inline-flex;align-items:center;min-height:44px}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}
</style>
</head>
<body>
<main>
<h1>404</h1>

<li lang="zh-CN"><h2>找不到页面</h2><p>该地址已更改或不存在。</p><a href="/zh-CN/" hreflang="zh-CN">BON 白皮书首页 · 简体中文</a></li>
<li lang="ja"><h2>ページが見つかりません</h2><p>アドレスが変更されたか、存在しないページです。</p><a href="/ja/" hreflang="ja">BON ホワイトペーパーのトップ · 日本語</a></li>
</ul>
</main>
</body>
</html>
